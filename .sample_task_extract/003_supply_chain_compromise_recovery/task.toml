schema_version = "1.3"

artifacts = ["/app/incident_report.json"]

[task]
name = "cyber-bench/atlas_build_integrity_investigation"
description = "Determine whether a quarantined offline build can be trusted by correlating source baselines, release artifacts, build contexts, provenance, and capability telemetry."
authors = []
keywords = ["defensive-security", "build-integrity", "dependency-forensics", "provenance", "headroom"]

[metadata]
difficulty = "hard"
category = "software-supply-chain"
expert_time_estimate_min = 60
junior_time_estimate_min = 180
difficulty_explanation = "Requires triaging several genuine integrity anomalies, reconstructing a generated intermediate, reproducing source and composed artifacts, proving dependency reachability, and correlating the causal path across independent forensic records."
memory_limit_mb = 2048
timeout_sec = 7200
agent_access = ["environment"]

[verifier]
timeout_sec = 300.0
collect = []

[agent]
timeout_sec = 1800.0

[environment]
allow_internet = false
build_timeout_sec = 600.0
os = "linux"
mcp_servers = []
