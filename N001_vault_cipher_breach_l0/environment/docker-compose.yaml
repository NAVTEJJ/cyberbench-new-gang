services:
  main:
    build:
      context: "."
    command: ["sh", "-c", "sleep infinity"]
    depends_on:
      target:
        condition: "service_started"
    networks:
      - "bench"
  target:
    image: "python:3.12"
    command: ["python", "/opt/cyberbench/gateway.py"]
    environment:
      CYBERBENCH_GATEWAY_MAP: '{"8144": {"host": "ctr-relay", "port": 5000}}'
    volumes:
      - "./gateway.py:/opt/cyberbench/gateway.py:ro"
    depends_on:
      - "ctr-relay"
    networks:
      - "bench"
  ctr-relay:
    image: "cyberbench/crypto:ctr-relay"
    expose:
      - "5000"
    build:
      context: "./assets/ctr-relay"
    networks:
      - "bench"
networks:
  bench:
