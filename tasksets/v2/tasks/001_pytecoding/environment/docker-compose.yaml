services:
  main:
    build:
      context: "."
    command:
      - "sh"
      - "-c"
      - "sleep infinity"
    depends_on:
      target:
        condition: "service_started"
  target:
    image: "python:3.12"
    command:
      - "python"
      - "/opt/cyberbench/gateway.py"
    environment:
      CYBERBENCH_GATEWAY_MAP: '{"8132": {"host": "dicectf-2026-pytecoding", "port": 5000}}'
    volumes:
      - "./gateway.py:/opt/cyberbench/gateway.py:ro"
    depends_on:
      - "dicectf-2026-pytecoding"
    networks:
      - "bench"
  dicectf-2026-pytecoding:
    image: "cb-pytecoding-slim:latest"
    build:
      context: "./assets/pytecoding"
    expose:
      - "5000"
    networks:
      - "bench"
  harbor-docker-egress-control-sidecar:
    image: "alpine:3.20"
    command: ["sh", "-c", "sleep infinity"]
    networks:
      bench:
        aliases:
          - "main"
networks:
  bench:
    internal: true
