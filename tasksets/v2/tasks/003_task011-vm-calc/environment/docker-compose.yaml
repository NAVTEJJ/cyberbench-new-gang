services:
  main:
    depends_on:
      target:
        condition: "service_started"
  target:
    image: "python:3.12"
    command:
      - "python"
      - "/opt/cyberbench/gateway.py"
    environment:
      CYBERBENCH_GATEWAY_MAP: '{"8503": {"host": "dicectf-2022-vm-calc", "port": 80}}'
    volumes:
      - "./gateway.py:/opt/cyberbench/gateway.py:ro"
    depends_on:
      - "dicectf-2022-vm-calc"
    networks:
      - "bench"
  dicectf-2022-vm-calc:
    build:
      context: "./assets/vm-calc"
    expose:
      - "80"
    networks:
      - "bench"
  harbor-docker-egress-control-sidecar:
    image: "alpine:3.20"
    command: ["sh", "-c", "sleep infinity"]
    networks:
      bench:
        aliases:
          - "main"
networks:
  bench:
    internal: true
