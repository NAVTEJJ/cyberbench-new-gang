services:
  main:
    build:
      context: "."
    command: ["sh","-c","sleep infinity"]
    depends_on:
      target:
        condition: "service_started"
  target:
    image: "python:3.12"
    command: ["python","/opt/cyberbench/gateway.py"]
    environment:
      CYBERBENCH_GATEWAY_MAP: '{"8461": {"host": "expandtabs-admin", "port": 5000}}'
    volumes: ["./gateway.py:/opt/cyberbench/gateway.py:ro"]
    depends_on: ["expandtabs-admin"]
    networks: ["bench"]
  expandtabs-admin:
    image: "cyberbench/sample:expandtabs-admin"
    expose: ["5000"]
    build:
      context: "./assets/expandtabs-admin"
    networks: ["bench"]
  harbor-docker-egress-control-sidecar:
    image: "alpine:3.20"
    command: ["sh", "-c", "sleep infinity"]
    networks:
      bench:
        aliases:
          - "main"
networks:
  bench:
    internal: true
