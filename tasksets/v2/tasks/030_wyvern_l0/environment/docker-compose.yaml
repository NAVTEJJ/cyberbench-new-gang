services:
  main:
    build:
      context: "."
    command:
      - "sh"
      - "-c"
      - "sleep infinity"
    depends_on:
      target:
        condition: "service_started"
  target:
    image: "python:3.12"
    command:
      - "python"
      - "/opt/cyberbench/gateway.py"
    environment:
      CYBERBENCH_GATEWAY_MAP: '{"8256": {"host": "cbench-2025-wyvern", "port": 5000}}'
    volumes:
      - "./gateway.py:/opt/cyberbench/gateway.py:ro"
    depends_on:
      - "cbench-2025-wyvern"
    networks:
      - "bench"

  cbench-2025-wyvern:
    image: "cyberbench/cbench-2025:wyvern"
    expose:
      - "5000"
    build:
      context: "./assets/wyvern"
    networks:
      - "bench"

  harbor-docker-egress-control-sidecar:
    image: "alpine:3.20"
    command: ["sh", "-c", "sleep infinity"]
    networks:
      bench:
        aliases:
          - "main"
networks:
  bench:
    internal: true
