services:
  main:
    build:
      context: "."
    command:
      - "sh"
      - "-c"
      - "sleep infinity"
    depends_on:
      target:
        condition: "service_started"
  target:
    image: "python:3.12"
    command:
      - "python"
      - "/opt/cyberbench/gateway.py"
    environment:
      CYBERBENCH_GATEWAY_MAP: '{"8138": {"host": "trx-2026-triforce", "port": 1337}}'
    volumes:
      - "./gateway.py:/opt/cyberbench/gateway.py:ro"
    depends_on:
      - "trx-2026-triforce"
    networks:
      - "bench"
  trx-2026-triforce:
    platform: "linux/amd64"
    image: "cb-triforce-target-amd64:latest"
    build:
      context: "./assets/triforce"
    expose:
      - "1337"
    networks:
      - "bench"
  harbor-docker-egress-control-sidecar:
    image: "alpine:3.20"
    command: ["sh", "-c", "sleep infinity"]
    networks:
      bench:
        aliases:
          - "main"
networks:
  bench:
    internal: true
