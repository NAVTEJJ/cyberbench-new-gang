services:
  main:
    build:
      context: "."
    command: ["sh", "-c", "sleep infinity"]
    depends_on:
      target:
        condition: "service_started"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  target:
    image: "python:3.12"
    command:
      - "python"
      - "/opt/cyberbench/gateway.py"
    environment:
      CYBERBENCH_GATEWAY_MAP: '{"8600": {"host": "graphql-api", "port": 5000}}'
    volumes:
      - "./gateway.py:/opt/cyberbench/gateway.py:ro"
    depends_on:
      - graphql-api

  graphql-api:
    build:
      context: "./assets/graphql-api"
    expose:
      - "5000"

networks:
  bench:
    internal: true