services:
  main:
    build:
      context: "."
    command:
      - "sh"
      - "-c"
      - "sleep infinity"
    depends_on:
      target:
        condition: "service_started"
    networks:
      - "bench"
  target:
    build:
      context: "."
    volumes:
      - "./app.py:/app/app.py:ro"
      - "./flag.txt:/app/flag.txt:ro"
    expose:
      - "5000"
    networks:
      - "bench"
networks:
  bench:
