schema_version = "1.3"

artifacts = ["/app/workspace/policy", "/app/adversarial_tests.json", "/app/hardening_report.json"]

[task]
name = "cyber-bench/sandbox_escape_surface_hardening"
description = "Harden an offline evaluation sandbox across network, proxy, identity, runtime, and artifact boundaries while preserving required workflows."
authors = []
keywords = ["defensive-security", "sandbox", "container-security", "proxy", "least-privilege", "headroom"]

[metadata]
difficulty = "hard"
category = "security-engineering"
expert_time_estimate_min = 80
junior_time_estimate_min = 210
difficulty_explanation = "Requires cross-layer trust-boundary reasoning and preservation of two required workflows; no single configuration change is sufficient."
memory_limit_mb = 2048
timeout_sec = 7200
agent_access = ["environment"]

[verifier]
timeout_sec = 300.0
collect = []

[agent]
timeout_sec = 1800.0

[environment]
allow_internet = false
build_timeout_sec = 600.0
os = "linux"
mcp_servers = []
