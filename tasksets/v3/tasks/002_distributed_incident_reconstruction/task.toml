schema_version = "1.3"

artifacts = ["/app/incident.json", "/app/timeline.jsonl", "/app/containment_actions.json", "/app/detection.json"]

[task]
name = "cyber-bench/distributed_incident_reconstruction"
description = "Reconstruct and contain a synthetic cross-system intrusion from noisy logs with clock drift and legitimate lookalike activity."
authors = []
keywords = ["incident-response", "forensics", "log-correlation", "containment", "detection-engineering", "headroom"]

[metadata]
difficulty = "hard"
category = "incident-response"
expert_time_estimate_min = 95
junior_time_estimate_min = 260
difficulty_explanation = "Requires piecewise clock normalization across correction epochs, evidence-backed joins across competing complete narratives, explicit identity-role classification, and cost-bounded behavioral detection and containment."
memory_limit_mb = 2048
timeout_sec = 7200
agent_access = ["environment"]

[verifier]
timeout_sec = 300.0
collect = []

[agent]
timeout_sec = 1800.0

[environment]
allow_internet = false
build_timeout_sec = 600.0
os = "linux"
mcp_servers = []
