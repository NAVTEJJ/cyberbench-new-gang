schema_version = "1.3"

artifacts = ["/app/detector.py"]

[task]
name = "cyber-bench/behavioral_detection_pack"
description = "Implement three correlation detections that generalize across noisy, reordered, and partially missing telemetry while controlling false positives."
authors = []
keywords = ["defensive-security", "detection-engineering", "correlation", "telemetry", "false-positives", "headroom"]

[metadata]
difficulty = "hard"
category = "detection-engineering"
expert_time_estimate_min = 100
junior_time_estimate_min = 270
difficulty_explanation = "Requires implementing three stateful behavioral correlations over unordered event streams with optional telemetry loss, cross-actor noise, strict evidence output, and benign near-misses."
memory_limit_mb = 2048
timeout_sec = 7200
agent_access = ["environment"]

[verifier]
timeout_sec = 300.0
collect = []

[agent]
timeout_sec = 7200.0

[environment]
allow_internet = false
build_timeout_sec = 600.0
os = "linux"
mcp_servers = []
